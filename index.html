
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmers and Languages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <h1 class="page__title">Programmers and their work</h1>

        <article class="panel">
            <h2 class="panel__title">language creators</h2>
            <div class="panel__scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Programming language</th>
                            <th>Year</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td data-role="person">Dennis</td>
                            <td>C programming</td>
                            <td>1972</td>
                        </tr>
                        <tr>
                            <td data-role="person">Guido</td>
                            <td>Python</td>
                            <td>1990</td>
                        </tr>
                        <tr>
                            <td data-role="person">Gosling</td>
                            <td>Java</td>
                            <td>1991</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </article>

        <article class="panel">
            <h2 class="panel__title">skills</h2>
            <div class="panel__scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th colspan="3">Skills</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td data-role="person">James</td>
                            <td>C</td>
                            <td>Java</td>
                            <td>HTML</td>
                        </tr>
                        <tr>
                            <td data-role="person">Guido</td>
                            <td>C++</td>
                            <td>Python</td>
                            <td>PHP</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </article>

        <article class="panel panel--grouped">
            <h2 class="panel__title">companies</h2>
            <div class="panel__scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Company</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td data-role="person" rowspan="3">James</td>
                            <td>Microsoft</td>
                        </tr>
                        <tr><td>Capgemini</td></tr>
                        <tr><td>Google</td></tr>
                        <tr>
                            <td data-role="person" rowspan="3">Guido</td>
                            <td>Dropbox</td>
                        </tr>
                        <tr><td>Liquid Robotics</td></tr>
                        <tr><td>Accenture</td></tr>
                    </tbody>
                </table>
            </div>
        </article>
    </div>
</body>
</html>
